# ============================================================================
# 全局顶栏统一规范（Unified TopBar Spec）— 2026-08-18 设立
# ============================================================================
# 适用：所有带标题顶栏的页面（设置族 / 相册族 / 信息页）。相机页（胶囊面板式）
# 与 chat 页（无标题图标行）各有专属形态，不在本规范约束范围。
#
# 双端 SSOT：
#   Android 实现 = AppTopBar.kt（features/common/topbar/，自建 Row）
#   设计稿几何   = Ardot canvas 各帧 top_bar（400×890 帧内坐标）
# 本文件为规格源；实现与设计稿向此对齐，发现漂移先改这里。

topbar:
  height: 48                       # dp（帧内 48px）
  layout:
    type: horizontal_row
    vertical_alignment: center
    padding: { start: 8, end: 8 }  # 触控热区起点；标题字面另有 8~16 起始（见变体）
    spacing: 8                     # 相邻动作钮间距

  title:
    font_size: 17                  # sp，Medium
    color: "onSurface"
    max_lines: 1                   # ⚠️ 禁止折行——宽度不足用省略号
    single_line: true

  # ── 变体 A：子页顶栏（back + title）──────────────────────────
  variant_subpage:
    leading:
      back_button: { touch: 36, glyph: 22, tint: "onSurface" }   # 36dp 热区居中 22dp 字形
    title:
      align: start                 # 返回钮之后左对齐（Android x≈44）
      # 设计稿几何（400 宽帧）：icon_back 22×22 @x8,y13；title @x38,y13.5 h21

  # ── 变体 B：首页顶栏（title + actions）───────────────────────
  variant_home:
    title:
      align: start
      padding_start: 16            # 无返回钮，标题从 16 起
      # 设计稿几何：title @x16,y13.5 h21 w218(grow)
    actions:
      button: { touch: 36, glyph: 22, tint: "onSurfaceVariant@0.8" }
      pack: end                    # 右对齐成组
      # 设计稿几何（相册首页 5 钮）：22×22 @y13，x = 242/272/302/332/362
      # （30px 节奏 = 22 图标 + 8 间距；最右图标右边 = 384，右缘留 16）

  # ── 变体 C：搜索顶栏（back + field + count）──────────────────
  variant_search:
    leading: { back: 36/22 }       # 同变体 A
    field:
      height: 36
      corner_radius: 18
      background: "surfaceVariant@0.5"
      grow: true                   # 撑满中间
      leading_icon: 16             # search
      placeholder: { size: 14, color: "onSurface@0.35" }
      clear_button: 16
    trailing:
      result_count: { size: 12, color: "onSurfaceVariant" }

  # ── 禁止事项（历史病灶，2026-08-18 相册帧踩过）────────────────
  anti_patterns:
    - "标题盒锁窄宽（<文本宽）→ 竖排折行（gallery/grid 等四帧曾 title 30×42）"
    - "动作图标大间距散布（60px 节奏）——必须 30px 节奏右对齐成组"
    - "标题与返回钮重叠（icon 8..30 内起字）——标题起 x≥38"
    - "顶栏高度 44/56 混用——统一 48"

# ── 状态栏避让 ────────────────────────────────────────────────
# Android：AppTopBar 内置 statusBarsPadding + displayCutoutPadding。
# 设计稿：帧从 y0 画起（状态栏区域由宿主让出），帧内不含状态栏占位。
# iOS：safeAreaInset.top 顶栏上留白，同一 48pt 高度内容区。
