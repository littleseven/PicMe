scene_panel:
  trigger: scene_mode
  anchor: bottom_sheet               # 复用 ControlPanel
  container:
    top_corner_radius: 24
    shadow_elevation: 16
    panel_height_ratio: 0.5
    drag_handle: standard
    padding_horizontal: 24
    padding_vertical: 12
  layout: row
  spacing: 12                        # 按钮间距 12dp
  items:
    - id: scene_none
      label: "无"                    # "无" / "None"
      value: NONE                    # ScenePreset.NONE
      style:
        selected:
          container_color: "colorScheme.primary"
          text_color: black
        unselected:
          container_color: "dark_gray"
          text_color: white

    - id: scene_night
      label: "夜景"                  # "夜景" / "Night"
      value: NIGHT                   # ScenePreset.NIGHT

    - id: scene_moon
      label: "月亮"                  # "月亮" / "Moon"
      value: MOON                    # ScenePreset.MOON
  behavior:
