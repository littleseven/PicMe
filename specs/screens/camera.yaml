# ============================================================================
# 15. 唤醒词状态指示器（VoiceWakeIndicator）
# ============================================================================
# 顶部居中，语音唤醒监听状态提示
wake_word_indicator:
  position: top_center
  visible_when: isWakeWordActive
  # P2 辅助功能，具体样式由 VoiceWakeIndicator 组件定义

# ============================================================================
# 16. 文档检测覆盖层（DocumentDetectionOverlay）
# ============================================================================
document_overlay:
  visible_when: "captureMode == DOCUMENT && !isAnyPanelOpen"
  full_screen: true
  # 显示文档边缘检测框，具体样式由 DocumentDetectionOverlay 组件定义

# ============================================================================
# 17. 面板状态机（互斥逻辑）
# ============================================================================
# 🔴 iOS 当前最严重的交互逻辑错误：无互斥，面板可同时弹出
panel_state_machine:
  description: |
    面板分两个轨道：Primary Panel 轨道 + ProMode 独立轨道。
    Primary Panel 之间严格互斥（同时只能开一个）。
    ProMode 独立于 Primary，但渲染时受 isAnyPanelOpen 抑制。

  primary_panels:
    members:
      - beauty_panel     # showBeautySelector
      - filter_panel     # showFilterSelector
      - ratio_panel      # showRatioSelector
      - scene_panel      # showSceneSelector
      - grid_panel       # showGridSelector
    mutex_rule: |
      togglePrimaryPanel(panel):
        1. nextVisibility = !panel.isVisible
        2. closePrimaryPanels()   ← 关闭全部 5 个 Primary Panel
        3. panel.isVisible = nextVisibility
      结果：同一时刻最多 1 个 Primary Panel 可见

  pro_mode_track:
    member: pro_mode_panel          # showProPanel
    toggle_rule: "直接 toggle，不走 closePrimaryPanels()"
    render_rule: "visible = showProPanel && !isAnyPanelOpen"
    # 即：即使 showProPanel=true，只要 Filter/Ratio/Scene/Grid 任一打开，ProMode 面板不渲染
    # 但 ProMode 和 BeautyPanel 可以同时渲染（Beauty 不在 isAnyPanelOpen 中）

  dismiss_rules:
    # 点击预览空白处
    click_blank_area:
      enabled_when: "isAnyPanelOpen || isBeautyPanelOpen || isProPanelOpen"
      action: |
        if (isProPanelOpen) {
          toggleProPanel()         # 单独关 ProMode
        } else {
          closeAllPanels()         # 关闭全部（Primary + 美颜子面板）
        }
    # Back 按键
    back_button:
      action: "closeAllPanels() + toggleProPanel()"  # 全关

  isAnyPanelOpen_definition: |
    isAnyPanelOpen = showFilterSelector || showRatioSelector ||
                     showSceneSelector || showGridSelector
    （不含 showBeautySelector、不含 showProPanel）

# ============================================================================
# 18. 所有状态枚举
# ============================================================================
states:

  # ── 拍照模式 ──
  capture_mode:
    - VIDEO
    - PHOTO                          # 默认
    - DOCUMENT

  # ── 比例 ──
  aspect_ratio:
    - RATIO_4_3                      # value=0, FIT_CENTER
    - RATIO_16_9                     # value=1, FIT_CENTER
    - RATIO_FULL                     # value=2, FILL_CENTER（默认）

  # ── 网格 ──
  grid_type:
    - NONE                           # 默认
    - THIRDS                         # 三分线
    - GOLDEN                         # 黄金比例

  # ── 场景 ──
  scene_preset:
    - NONE                           # 默认
    - NIGHT                          # 夜景
    - MOON                           # 月亮

  # ── 滤镜（色调 9 款）──
  filter_type:
    - NONE                           # 默认（原图）
    - LEICA_CLASSIC
    - LEICA_VIBRANT
    - LEICA_BW
    - FILM_GOLD
    - FILM_FUJI
    - VINTAGE
    - COOL
    - WARM

  # ── 滤镜（风格 5 款）──
  style_filter:
    - NONE                           # 默认
    - TOON
    - SKETCH
    - POSTERIZE
    - EMBOSS
    - CROSSHATCH

  # ── 面板可见状态（互斥组）──
  panel_visibility:
    primary_group:                   # 互斥，同时最多 1 个为 true
      showBeautySelector: false      # 美颜面板
      showFilterSelector: false      # 滤镜面板
      showRatioSelector: false       # 比例面板
      showSceneSelector: false       # 场景面板
      showGridSelector: false        # 网格面板
    independent:
      showProPanel: false            # ProMode 面板（独立轨道）

  # ── 美颜 Tab ──
  beauty_tab:
    - FACE                           # 面部精修（默认）
    - MAKEUP                         # 妆容

  # ── 腮红色系 ──
  blush_color_family:
    - 0                              # 粉色 Pink (#FF8DAA)
    - 1                              # 橙色 Orange (#FFA85C)
    - 2                              # 梅色 Plum (#9B3D6A)

  # ── 白平衡模式 ──
  white_balance:
    - 0                              # Auto
    - 1                              # Sunny
    - 2                              # Cloudy
    - 3                              # Incandescent
    - 4                              # Fluorescent

  # ── 镜头朝向 ──
  lens_facing:
    - 0                              # 前摄 (FRONT)
    - 1                              # 后摄 (BACK)（默认）

  # ── 页面交互状态 ──
  interaction_state:
    - idle                           # 默认：预览 + 顶部按钮 + 底部控件
    - panel_open                     # 面板展开（Back/空白点击关闭）
    - capturing                      # 拍照中（快门动画+闪屏，交互禁用）
    - recording                      # 录像中（快门变红底方块）
    - focusing                       # 对焦中（focus_ring 显示）

# ============================================================================
# 19. 美颜设置默认值（BeautySettings）
# ============================================================================
beauty_settings_defaults:
  enabled: false                     # 美颜总开关，默认关
  smoothing: 0                      # 磨皮 0-100
  whitening: 0                      # 美白 0-100
  slimFace: 0                       # 瘦脸 -50~50
  bigEyes: 0                        # 大眼 0-100
  lipColor: 0                       # 唇彩强度 0-100（DEFAULT_LIP_COLOR = 0）
  lipColorIndex: 0                  # 唇彩色号索引 0-11
  blush: 0                          # 腮红强度 0-100（DEFAULT_BLUSH = 0）
  blushColorFamily: 0               # 腮红色系 0-2
  contrast: 50                      # 对比度 0-200（默认 50）
  saturation: 100                   # 饱和度 0-200（默认 100）
  temperature: 5000                 # 色温 2000-8000K（默认 5000）

# ============================================================================
# 20. 允许的平台差异
# ============================================================================
allowed_differences:
  - dimension: font
    android: Roboto
    ios: SF Pro
    note: "字体族差异可接受"

  - dimension: icon_set
    android: Material Icons (Icons.Rounded.*)
    ios: SF Symbols
    note: "语义一致即可，尺寸/颜色保持一致"
    mapping_examples:
      arrow_back: "chevron.left"
      refresh: "arrow.clockwise"
      auto_fix_high: "wand.and.stars"
      aspect_ratio: "aspectratio"
      grid_on: "square.grid.3x3"
      landscape: "mountain.2"
      filter_b_and_w: "camera.filters"
      tune: "slider.horizontal.3"
      cameraswitch: "camera.rotate"
      record_voice_over: "waveform"
      keyboard_voice: "mic.fill"

  - dimension: focus_animation_curve
    android: "Spring(DampingRatioMediumBouncy, StiffnessMedium)"
    ios: "iOS spring animation（近似弹性参数）"
    note: "动画曲线细节可各用平台原生"

  - dimension: shutter_feedback
    android: "可选振动（Vibrator）"
    ios: "Haptic Feedback（UIImpactFeedbackGenerator）"
    note: "触觉反馈各用平台原生"

  - dimension: panel_material
    android: "surface.copy(alpha=0.95) + 渐变遮罩"
    ios: ".ultraThinMaterial（毛玻璃）或近似"
    note: "面板背景材质差异可接受，但圆角值必须用 24dp/pt"

  - dimension: filter_selected_border
    android: "linearGradient(primary, onSurface) 2.5dp"
    ios: "AngularGradient 近似或实色 accentColor 2.5pt"
    note: "渐变 vs 实色风格差异可接受"

  - dimension: preview_zoom_gesture
    note: "iOS 可保留 pinch-to-zoom（MagnificationGesture）作为原生增强，但必须同时有底部预设按钮条"
