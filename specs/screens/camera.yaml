# ============================================================================
# 相机屏完整产品规格书（Camera Screen Spec）
# ============================================================================
# 基准端：Android CameraScreen.kt / CameraPreviewContent.kt / CameraControls.kt
#        / CameraControlButtons.kt / BeautyPanel.kt / FilterSelector.kt
#        / CameraBaseComponents.kt / ProModeControls.kt / ColorSelectors.kt
#        / CameraOverlays.kt / CameraRuntimeState.kt
# 用途：iOS 重做的唯一输入，不读 Android 源码
# 双端对齐原则：结构零容差一致（信息层级/布局结构/功能默认/文案状态），平台材质各自原生
# 值引用：尺寸引用 design-tokens.json 的 token 名（如 topBar.height），数值在注释中标注
# 颜色引用：appColors.* 对应 design-tokens.json color 节点
# 图标映射：Material Icons (Android) → SF Symbols (iOS)

# ============================================================================
# 1. 总体结构
# ============================================================================
root:
  type: full_screen          # 全屏 Box
  background: "#000000"      # 纯黑底色
  fill_strategy: edge_to_edge # 预览延伸至屏幕物理边缘（四边）
  layout: zstack             # ZStack（层叠），预览在底层，所有控件浮在预览之上
  click_to_dismiss:
    enabled_when: any_panel_open  # 任何面板打开时，点击预览空白处关闭面板
    action: close_all_panels       # ProPanel 单独关闭，其余一键全关

# ============================================================================
# 2. 系统栏状态
# ============================================================================
status_bar:
  visible: false              # 沉浸式隐藏（Android: WindowInsetsControllerCompat.hide(systemBars)）
  content_color: light        # iOS: lightContent（浅色图标，黑底白字）
  ios_note: ".ignoresSafeArea() + preferredStatusBarStyle = .lightContent"

home_indicator:
  defer_gestures: true        # iOS: preferredScreenEdgesDeferringSystemGestures（底部上划需二次确认才回桌面）
  android_immersive: true     # Android: 沉浸模式，边缘二次确认

# Back 栈优先级链（Back 按键 / 手势返回）
back_stack:
  - condition: panel_expanded  # 有面板展开时
    action: close_panel         # Back 先关面板（不分类型，全关）
  - condition: default          # 无面板时
    action: exit_camera         # Back 退出相机

# ============================================================================
# 3. 顶部左侧控件组（CameraLeftControls）
# ============================================================================
# 位置：Alignment.TopStart，statusBarsPadding 内避让
# 布局：Column，spacing = 8dp（topBar.spacing），padding = 16dp
top_left_controls:
  anchor: top_start
  layout: column
  padding: 16                 # 外边距 16dp
  status_bar_padding: true    # 避让状态栏
  spacing: 8                  # topBar.spacing = 8dp
  items:
    - id: back_button
      type: filled_icon_button  # FilledIconButton
      size: 48                   # 48dp（实际 ControlButton 用 48dp，非 topBar.buttonSize 36dp）
      icon:
        material: arrow_back     # Icons.AutoMirrored.Rounded.ArrowBack
        sf_symbol: "chevron.left"
      icon_size: 24              # icon.lg = 24dp
      container_color:
        active: "colorScheme.primary"      # 激活态=primary 色
        inactive: "black_alpha_50"         # 非激活=黑 50% 透明
      content_color:
        active: "black"                    # 激活=黑字
        inactive: "white"                  # 非激活=白字
      behavior:
        click: navigate_back               # 点击返回（退出相机页）

    - id: reset_button
      type: filled_icon_button
      size: 48
      icon:
        material: refresh       # Icons.Rounded.Refresh
        sf_symbol: "arrow.clockwise"
      icon_size: 24
      behavior:
        click: reset_camera_memory_state  # 重置相机内存状态
      container_color: "black_alpha_50"    # 默认非激活态
      content_color: "white"

    - id: debug_toggle
      type: filled_icon_button
      size: 48
      visible_when: debug_ui_enabled  # 仅 debug 模式显示
      icon:
        material: terminal      # Icons.Rounded.Terminal
        sf_symbol: "terminal"
      icon_size: 24
      behavior:
        click: toggle_log_overlay       # 切换日志覆盖层
      active_state:
        container_color: "colorScheme.primary"
        content_color: "black"
      inactive_state:
        container_color: "black_alpha_50"
        content_color: "white"

    - id: llm_release_button         # 仅 debug 模式
      type: filled_icon_button
      size: 36                       # 比其他按钮小
      visible_when: debug_ui_enabled
      icon:
        material: psychology         # Icons.Rounded.Psychology
        sf_symbol: "brain"
      icon_size: 24
      tint: "#64B5F6"               # 浅蓝色（固定）
      behavior:
        click: release_llm           # 全量释放 LLM 引擎

    - id: face_detect_release_button  # 仅 debug 模式
      type: filled_icon_button
      size: 36
      visible_when: debug_ui_enabled
      icon:
        material: face              # Icons.Rounded.Face
        sf_symbol: "face.smiling"
      icon_size: 24
      tint: "#81C784"              # 浅绿色（固定）
      behavior:
        click: release_face_detect  # 全量释放人脸检测

# ============================================================================
# 4. 顶部右侧功能列（CameraRightControls）
# ============================================================================
# 位置：Alignment.TopEnd，statusBarsPadding 内避让
# 布局：Column，spacing = 10dp（控件间默认），含 8dp Spacer 分隔组
# 每个按钮 = FilledIconButton，48dp，24dp 图标
top_right_controls:
  anchor: top_end
  layout: column
  padding: 16
  status_bar_padding: true
  spacing: 10                     # 按钮间距
  items:

    # ── 美颜入口（特殊按钮，有总开关+面板开关双功能）──
    - id: beauty_entry
      type: beauty_entry_button   # 特殊组件 BeautyEntryButton
      size: 48
      icon:
        material: auto_fix_high   # Icons.Rounded.AutoFixHigh
        sf_symbol: "wand.and.stars"
      icon_size: 24
      # 三态容器颜色
      container_color:
        panel_open: "colorScheme.primary"           # 面板开 → primary 底
        beauty_enabled_not_open: "primary_alpha_25"  # 美颜启用但面板关 → primary 25% 透明底
        disabled: "black_alpha_50"                   # 未启用 → 黑 50% 透明底
      content_color:
        panel_open: "black"                          # 面板开 → 黑字
        beauty_enabled_not_open: "colorScheme.primary"
        disabled: "white_alpha_55"
      # 右上角角标：美颜启用且面板未开时
      badge:
        visible_when: "beauty_enabled && !beauty_panel_open"
        size: 8
        color: "colorScheme.primary"
        border: "1dp black_alpha_60"
        position: top_end
        offset: "top=4dp, end=4dp"
      behavior:
        click: toggle_beauty_panel     # 点击 = 开/关美颜面板
        # 注：Android 源码有 onToggleBeautyEnabled 但实际接线为面板切换，
        #   long_press 可预留为美颜总开关 toggle（当前未实现长按）

    # 8dp Spacer 分隔

    # ── 比例选择 ──
    - id: ratio_switch
      type: filled_icon_button
      size: 48
      icon:
        material_dynamic: true       # 图标随当前比例变化
        ratio_4_3: aspect_ratio      # Icons.Rounded.AspectRatio → "aspectratio"
        ratio_16_9: crop_16_9        # Icons.Rounded.Crop169 → "crop.16.9"
        ratio_full: crop_square      # Icons.Rounded.CropSquare → "crop.square"（注：当前 FULL=2 用 CropSquare）
        sf_symbol_default: "crop"
      icon_size: 24
      active_state:
        container_color: "colorScheme.primary"
        content_color: "black"
      inactive_state:
        container_color: "black_alpha_50"
        content_color: "white"
      behavior:
        click: toggle_ratio_panel    # 点击弹出/收起比例选择器面板

    # ── 网格选择 ──
    - id: grid_toggle
      type: filled_icon_button
      size: 48
      icon:
        material: grid_on            # Icons.Rounded.GridOn
        sf_symbol: "square.grid.3x3"
      icon_size: 24
      active_state:
        container_color: "colorScheme.primary"
        content_color: "black"
      inactive_state:
        container_color: "black_alpha_50"
        content_color: "white"
      behavior:
        click: toggle_grid_panel

    # 8dp Spacer 分隔

    # ── 场景选择 ──
    - id: scene_mode
      type: filled_icon_button
      size: 48
      icon:
        material: landscape          # Icons.Rounded.Landscape
        sf_symbol: "mountain.2"
      icon_size: 24
      active_state:
        container_color: "colorScheme.primary"  # scene != NONE 时激活
        content_color: "black"
      inactive_state:
        container_color: "black_alpha_50"
        content_color: "white"
      behavior:
        click: toggle_scene_panel

    # ── 滤镜选择 ──
    - id: filter_button
      type: filled_icon_button
      size: 48
      icon:
        material: filter_b_and_w     # Icons.Rounded.FilterBAndW
        sf_symbol: "camera.filters"
      icon_size: 24
      active_state:
        container_color: "colorScheme.primary"
        content_color: "black"
      inactive_state:
        container_color: "black_alpha_50"
        content_color: "white"
      behavior:
        click: toggle_filter_panel

    # 8dp Spacer 分隔

    # ── ProMode ──
    - id: pro_mode
      type: filled_icon_button
      size: 48
      icon:
        material: tune               # Icons.Filled.Tune
        sf_symbol: "slider.horizontal.3"
      icon_size: 24
      active_state:
        container_color: "colorScheme.primary"
        content_color: "black"
      inactive_state:
        container_color: "black_alpha_50"
        content_color: "white"
      behavior:
        click: toggle_pro_panel      # 独立轨道，不走 PrimaryPanel 互斥

# ============================================================================
# 5. 预览区
# ============================================================================
preview:
  type: camera_surface
  fill: full_screen                # 全屏填充
  background: "#000000"            # 纯黑底
  aspect_ratio_modes:
    - id: ratio_4_3
      value: 0                      # AspectRatio.RATIO_4_3
      scale_type: fit_center        # FIT_CENTER（留黑边）
      label: "4:3"
    - id: ratio_16_9
      value: 1
      scale_type: fit_center
      label: "16:9"
    - id: ratio_full
      value: 2
      scale_type: fill_center       # FILL_CENTER（裁剪填充全屏）
      label: "FULL"
  default: ratio_full               # 默认 FULL

  # ── 对焦框（FaceFocusCrosshair）──
  # 🔴 iOS 当前最严重对齐项之一：尺寸/颜色/形状/动画全不同
  focus_ring:
    component: "FaceFocusCrosshair"
    outer_size: 100                 # 100dp 外框（固定）
    corner_mark_style: L_shaped     # 4 角 L 型线段（非圆角方框！）
    corner_length: 20               # 每角 L 拐角长度 20dp
    stroke_width: 3                 # L 角线宽 3dp
    color: "#00E5FF"                # appColors.focusRing = #00E5FF（青色/cyan）
    active_alpha: 1.0               # isActive 时 alpha=1.0
    inactive_alpha: 0.5             # 非 active 时 alpha=0.5
    center_cross:
      size: 16                      # 中心十字 16dp
      stroke_width: 2               # 十字线宽 2dp
      alpha: 0.8                    # 十字 alpha=0.8（比角标记淡）
    center_dot:
      radius: 3                     # 中心点圆半径 3dp
      alpha: 1.0                    # 实心
    animation:
      type: spring                  # 弹簧动画（非 ease-out！）
      spec:
        damping_ratio: medium_bouncy  # Spring.DampingRatioMediumBouncy
        stiffness: medium              # Spring.StiffnessMedium
      scale_range:
        visible: 1.0                # alpha > 0.5 时缩放到 1.0
        hidden: 0.6                 # alpha <= 0.5 时缩放到 0.6
    trigger: face_detection         # 联动人脸检测，显示位置为人脸中心
    duration: controlled_by_focus_alpha  # 持续时间由 focusAlpha 状态值控制

# ============================================================================
# 6. 构图网格叠加（CompositionGrid）
# ============================================================================
# 🔴 iOS 完全缺失
composition_grid:
  component: "CompositionGrid"
  full_screen_overlay: true         # 覆盖整个预览区
  modes:
    - id: none
      value: NONE                   # GridType.NONE
      visible: false
    - id: thirds
      value: THIRDS                 # GridType.THIRDS
      description: "三分线（九宫格）"
      lines: 2_vertical + 2_horizontal  # 2 竖线 + 2 横线，均分三等分
    - id: golden
      value: GOLDEN                 # GridType.GOLDEN
      description: "黄金比例线"
      ratio: 0.618                  # 线位置在 0.618 和 (1-0.618)=0.382 处
      lines: 2_vertical + 2_horizontal
  line_style:
    color: "white_alpha_50"         # 白色 50% 透明
    width: 1                        # 1dp 线宽
    dash_pattern: [10, 10]          # 虚线：10px 实线 + 10px 空白
  toggle: via_grid_panel            # 通过网格选择面板切换

# ============================================================================
# 7. 底部控件区（CameraBottomControls）
# ============================================================================
# 位置：Alignment.BottomCenter
# 布局：Column，center 水平对齐
# padding: bottom=20dp, navigationBarsPadding
# spacing: 20dp（行间距）
bottom_area:
  anchor: bottom_center
  layout: column
  horizontal_alignment: center
  padding_bottom: 20
  navigation_bars_padding: true
  row_spacing: 20                   # 行间距 20dp
  background: none                  # 无背景（透明，预览内容直接可见）

  # ── 第 1 行：变焦预设条（ZoomControls）──
  # 🔴 iOS 完全缺失
  zoom_presets:
    visible_when: "!isAnyPanelOpen"  # 面板打开时隐藏
    layout: row_center
    spacing: 12                      # spacing.md = 12dp（按钮间距）
    container:
      shape: rounded_corner_20       # RoundedCornerShape(20dp)
      background: "black_alpha_40"   # 黑 40% 透明底
      padding_horizontal: 12
      padding_vertical: 6
    items:
      - id: zoom_0_6x
        label: "0.6x"
        visible_when: "minZoomRatio <= 0.6"  # 仅设备支持超广角时显示
        selected_when: "zoomRatio < 0.9"
        size: 32                     # 32dp 圆形按钮
        selected_style:
          background: white           # 白底
          text_color: black           # 黑字
        unselected_style:
          background: transparent
          text_color: white
        text_size: 10                # 10sp
        text_weight: bold
        behavior:
          click: set_zoom_ratio(0.6)

      - id: zoom_1x
        label: "1x"
        selected_when: "zoomRatio >= 0.9 && zoomRatio < 1.5"
        default_selected: true
        size: 32
        behavior:
          click: set_zoom_ratio(1.0)

      - id: zoom_2x
        label: "2x"
        selected_when: "zoomRatio >= 1.5 && zoomRatio < 2.8"
        size: 32
        behavior:
          click: set_zoom_ratio(2.0)

      - id: zoom_3_2x
        label: "3.2x"
        visible_when: "maxZoomRatio >= 3.2"  # 仅设备支持时显示
        selected_when: "zoomRatio >= 2.8"
        size: 32
        behavior:
          click: set_zoom_ratio(3.2)

  # ── 第 2 行：模式选择器（ModeSelector）──
  # 🔴 iOS 完全缺失
  mode_selector:
    layout: row_center
    padding_vertical: 8
    items:
      - id: video_mode
        label: "VIDEO"              # 文案常量（三语 i18n）
        capture_mode: VIDEO
        selected_style:
          color: "colorScheme.primary"   # 当前模式 = primary 色
          weight: bold                    # Bold
          size: 13                        # 13sp
        unselected_style:
          color: "white_alpha_60"        # 白 60% 透明
          weight: normal
          size: 13
        padding_horizontal: 12           # 左右各 12dp

      - id: photo_mode
        label: "PHOTO"
        capture_mode: PHOTO
        default_selected: true
        padding_horizontal: 12

      - id: document_mode
        label: "DOCUMENT"
        capture_mode: DOCUMENT
        padding_horizontal: 12

  # ── 第 3 行：快门行（缩略图 | 快门 | 翻转）──
  shutter_row:
    layout: row_space_between_center
    padding_horizontal: 40           # 左右各 40dp

    # ── 左侧：相册缩略图 ──
    # 🔴 iOS 完全缺失
    - id: gallery_thumbnail
      shape: circle
      size: 48                       # 48dp 圆形
      background: "dark_gray"        # Color.DarkGray 底（无媒体时）
      content:
        type: latest_media_image     # 最近一张媒体缩略图
        scale: crop                  # ContentScale.Crop
        crossfade: true
      behavior:
        click: navigate_to_gallery   # 跳转相册页
      accessibility_label: "Gallery"

    # ── 中间：快门按钮 ──
    # 🔴 iOS 尺寸差(72 vs 76)、缺录像态、缺防抖
    - id: shutter_button
      shape: circle
      outer_diameter: 76             # shutter.diameter = 76dp
      ring:
        width: 4                     # 4dp 白色圆环边框
        color: "white"               # appColors.shutterRing = #FFFFFFFF
      inner_padding: 6               # 圆环与内填之间 6dp padding
      inner_diameter: 58             # shutter.innerDiameter = 58dp
      # 内填颜色随模式变化
      inner_color:
        photo_mode: "white"          # 拍照 = 白色填充
        video_mode: "red"            # 录像 = 红色填充（Color.Red）
      # 录像态：内填变为 28dp 白色圆角方块
      recording_state:
        visible_when: "isRecording"
        center_block:
          size: 28                   # 28dp 白色圆角方块
          corner_radius: 4           # RoundedCornerShape(4dp)
          color: "white"
      debounce:
        interval_ms: 500             # 500ms 防抖（lastClickTime 模式）
      accessibility_label: "Shutter"

    # ── 右侧：翻转摄像头 ──
    # 🔴 iOS 完全缺失
    - id: flip_camera
      shape: circle
      size: 48                       # 48dp 圆形
      background: "white_alpha_20"   # 白 20% 透明底
      icon:
        material: cameraswitch       # Icons.Rounded.Cameraswitch
        sf_symbol: "camera.rotate"
      icon_color: white
      behavior:
        click: flip_camera           # 切换前/后摄

  # ── 快门闪屏动画 ──
  # 🔴 iOS 完全缺失
  shutter_flash:
    type: full_screen_overlay        # 全屏黑色覆盖层
    color: black
    animation:
      property: opacity              # Animatable(0f) → 0→1→0
      trigger: on_photo_captured     # 拍照触发
      duration: "闪一下（短暂 opacity 峰值后回落）"

# ============================================================================
# 8. 美颜面板（BeautyPanel）
# ============================================================================
# 🔴 iOS 缺 Tab 切换、缺拖拽手柄、缺滑杆图标/数值/重置、缺整个 MAKEUP Tab
beauty_panel:
  trigger: beauty_entry_button       # 右上角美颜入口按钮触发
  anchor: bottom_sheet
  animation:
    enter: slide_in_vertically + fade_in   # 从底部滑入 + 淡入
    exit: slide_out_vertically + fade_out
  height: "screenHeight * 0.35"      # beautyPanel.heightRatio = 35% 屏高
  max_height_clamp: "0.2 ~ 0.75"    # clamp(0.2f, 0.75f)

  container:
    top_corner_radius: 24            # beautyPanel.topCornerRadius = 24dp（仅顶部两角）
    background:
      panel_surface: "colorScheme.surface_alpha_95"  # surface.copy(alpha=0.95)
      gradient_overlay:              # 面板下方的底部渐变遮罩（在面板之外）
        colors: ["transparent", "black_alpha_55", "black_alpha_82"]
    shadow_elevation: 16             # 16dp 阴影
    border: "0.5dp outlineVariant_alpha_25"  # 0.5dp 边框
    navigation_bars_padding: true

  # ── 拖拽手柄 ──
  # 🔴 iOS 缺失
  drag_handle:
    width: 36                        # 36dp
    height: 4                        # 4dp
    shape: circle                    # 胶囊形（CircleShape clip）
    color: "onSurface_alpha_20"      # onSurface 20% 透明
    position: top_center
    margin_top: 10
    margin_bottom: 4

  # ── 面板内容区 ──
  content_area:
    padding_horizontal: 24
    padding_vertical: 8
    spacing: 12                      # 滑杆间距 12dp
    scrollable: true                 # verticalScroll

  # ── 底部 Tab 栏 ──
  # 🔴 iOS 缺失（当前只有 flat 4 条滑杆，无 Tab）
  tab_bar:
    position: panel_bottom           # 面板底部固定
    background: "colorScheme.surface"
    padding_vertical: 8
    tabs:
      - id: face_tab
        label: "面部精修"            # "面部精修" / "Facial Refinement"
        icon:
          material: face_retouching_natural  # Icons.Rounded.FaceRetouchingNatural
          sf_symbol: "face.smiling"
        icon_size: 24                # beautyPanel.iconSize = 24dp
        selected_style:
          background: "primary_alpha_12"    # primary 12% 透明底
          icon_tint: "colorScheme.primary"
        unselected_style:
          background: transparent
          icon_tint: "onSurface_alpha_50"
        corner_radius: 10            # RoundedCornerShape(10dp)
        padding_vertical: 8

      - id: makeup_tab
        label: "妆容"                # "妆容" / "Makeup"
        icon:
          material: color_lens       # Icons.Rounded.ColorLens
          sf_symbol: "paintpalette"
        icon_size: 24
        # 同上样式

  # ── FACE Tab 内容：4 条滑杆 ──
  face_tab_sliders:

    # 每条 BeautySlider 的通用结构：
    # ┌──────────────────────────────────────────┐
    # │ [icon] Label          (点击重置)   42    │ ← Row: 图标+标签(可点击重置) | 数值显示
    │ │─────── AppSlider ─────────────────────│ ← 滑杆
    # └──────────────────────────────────────────┘
    #
    # 图标：非零=primary 色，零=onSurface 60% 透明
    # 数值：非零=primary 色 Bold 数字，零="--" onSurface 40% 透明
    # 重置：点击图标+标签行 → 该项重置为 0
    # 滑杆：AppSlider，fillMaxWidth，height=32dp

    - id: smoothing
      label: "磨皮"                  # "磨皮" / "Smoothing"
      icon:
        material: face               # Icons.Rounded.Face
        sf_symbol: "face.smiling"
        size: 18                     # beautyPanel.iconSize 滑杆图标实际 18dp
      value_range: [0, 100]          # 0f..100f
      default_value: 0
      display_format: integer        # 整数显示（0-100）
      reset_value: 0
      on_reset: "smoothing = 0f"

    - id: whitening
      label: "美白"                  # "美白" / "Whitening"
      icon:
        material: auto_fix_high      # Icons.Rounded.AutoFixHigh
        sf_symbol: "wand.and.stars"
        size: 18
      value_range: [0, 100]
      default_value: 0
      display_format: integer
      reset_value: 0
      on_reset: "whitening = 0f"

    - id: slim_face
      label: "瘦脸"                  # "瘦脸" / "Slim Face"
      icon:
        material: face_retouching_natural  # Icons.Rounded.FaceRetouchingNatural
        sf_symbol: "face.dashed"
        size: 18
      value_range: [-50, 50]         # -50f..50f（唯一支持负值的滑杆）
      default_value: 0
      display_format: signed_integer # 带符号整数显示
      reset_value: 0
      on_reset: "slimFace = 0f"

    - id: big_eyes
      label: "大眼"                  # "大眼" / "Big Eyes"
      icon:
        material: visibility         # Icons.Rounded.Visibility
        sf_symbol: "eye"
        size: 18
      value_range: [0, 100]
      default_value: 0
      display_format: integer
      reset_value: 0
      on_reset: "bigEyes = 0f"

  # ── MAKEUP Tab 内容 ──
  # 🔴 iOS 整个 Tab 缺失
  makeup_tab_content:

    # ── 唇彩选择器（LipColorSelector）──
    lip_color:
      header:
        icon:
          material: color_lens       # Icons.Rounded.ColorLens
          sf_symbol: "paintpalette"
          size: 18
        label: "唇彩"                # "唇彩" / "Lip Color"
        click_to_reset: true         # 点击图标+标签行重置
        value_display:
          active: "strength.toInt()"  # 强度数值
          inactive: "--"
          color_active: "colorScheme.primary"
          color_inactive: "onSurface_alpha_40"

      # 12 色调色板
      color_palette:
        layout: lazy_horizontal_grid  # LazyHorizontalGrid
        rows: 2                       # 2 行
        height: 64                    # 64dp
        spacing: 8                    # 水平/垂直各 8dp
        colors:
          - "#D4757D"  # 珊瑚粉
          - "#C43343"  # 正红
          - "#FF7F50"  # 珊瑚橙
          - "#E0527C"  # 玫红
          - "#FF6B9D"  # 粉红
          - "#9B2335"  # 深红
          - "#FFA07A"  # 浅鲑鱼色
          - "#CD5C5C"  # 印度红
          - "#DC143C"  # 猩红
          - "#FFB6C1"  # 浅粉
          - "#B22222"  # 火砖红
          - "#FF1493"  # 深粉
        item_size: [48, 28]          # 每个 48x28dp
        item_corner_radius: 8         # RoundedCornerShape(8dp)
        selected_style:
          border_width: 3            # 3dp
          border_color: "colorScheme.primary"
        unselected_style:
          border_width: 1
          border_color: "white_alpha_30"
        default_selected_index: 0

      # 唇彩强度滑杆
      strength_slider:
        value_range: [0, 100]
        default_value: 0             # DEFAULT_LIP_COLOR = 0f
        reset_value: 0
        height: 32

    # ── 腮红色系选择器（BlushColorFamilySelector）──
    blush_color_family:
      label: "腮红色系"              # "腮红色系" / "Blush Color Family"
      label_size: 13
      label_weight: medium
      layout: row
      spacing: 8
      families:
        - id: pink
          label: "粉色"              # "粉色" / "Pink"
          color_dot: "#FF8DAA"
          dot_size: 10
        - id: orange
          label: "橙色"              # "橙色" / "Orange"
          color_dot: "#FFA85C"
          dot_size: 10
        - id: plum
          label: "梅色"              # "梅色" / "Plum"
          color_dot: "#9B3D6A"
          dot_size: 10
      item_style:
        shape: rounded_corner_12     # RoundedCornerShape(12dp)
        padding_horizontal: 10
        padding_vertical: 6
        selected:
          background: "primary_alpha_15"
          border_width: 1.5
          border_color: "colorScheme.primary"
          text_color: "colorScheme.primary"
        unselected:
          background: "surfaceVariant_alpha_25"
          border_width: 1
          border_color: "outline_alpha_30"
          text_color: "onSurface_alpha_85"
      default_selected_index: 0

    # ── 腮红强度滑杆 ──
    blush_slider:
      icon:
        material: favorite_border    # Icons.Rounded.FavoriteBorder
        sf_symbol: "heart"
        size: 18
      label: "腮红"                  # "腮红" / "Blush"
      value_range: [0, 100]
      default_value: 0               # DEFAULT_BLUSH = 0f
      display_format: integer
      reset_value: 0                 # BeautySettings.DEFAULT_BLUSH
      click_to_reset: true

# ============================================================================
# 9. 滤镜面板（UnifiedFilterSelector）
# ============================================================================
# 🔴 iOS 布局不同（横滑条 vs 5 列网格）+ 缺 5 款风格滤镜
filter_panel:
  trigger: filter_button
  anchor: bottom_sheet               # 复用通用 ControlPanel 容器
  container:
    # 与美颜面板容器样式一致（渐变遮罩 + Surface 面板 + 圆角 + 阴影 + 手柄）
    top_corner_radius: 24
    shadow_elevation: 16
    border: "0.5dp outlineVariant_alpha_25"
    drag_handle:
      width: 36
      height: 4
      color: "onSurface_alpha_20"
    panel_height_ratio: 0.5          # ControlPanel 使用 50% 屏高（非美颜的 35%）
    padding_horizontal: 24
    padding_vertical: 12

  grid:
    layout: vertical_grid            # LazyVerticalGrid
    columns: 5                       # 固定 5 列
    height: 280                      # 固定高度 280dp
    padding_vertical: 8
    horizontal_spacing: 4
    vertical_spacing: 8
    content_padding_horizontal: 12
    item_width: "(screenWidth - 20dp) / 5"  # 动态计算

  filter_list:
    # ── 9 款色调滤镜（FilterType）──
    color_filters:
      - id: NONE
        display_name: "原图"         # "原图" / "None"
        asset: "filters/filter_none.jpg"
      - id: LEICA_CLASSIC
        display_name: "经典"         # "经典" / "Leica Classic"
        asset: "filters/filter_leica_classic.jpg"
      - id: LEICA_VIBRANT
        display_name: "鲜艳"         # "鲜艳" / "Leica Vibrant"
        asset: "filters/filter_leica_vibrant.jpg"
      - id: LEICA_BW
        display_name: "黑白"         # "黑白" / "Leica B&W"
        asset: "filters/filter_leica_bw.jpg"
      - id: FILM_GOLD
        display_name: "金胶片"       # "金胶片" / "Film Gold"
        asset: "filters/filter_film_gold.jpg"
      - id: FILM_FUJI
        display_name: "富士"         # "富士" / "Film Fuji"
        asset: "filters/filter_film_fuji.jpg"
      - id: VINTAGE
        display_name: "复古"         # "复古" / "Vintage"
        asset: "filters/filter_vintage.jpg"
      - id: COOL
        display_name: "冷调"         # "冷调" / "Cool"
        asset: "filters/filter_cool.jpg"
      - id: WARM
        display_name: "暖调"         # "暖调" / "Warm"
        asset: "filters/filter_warm.jpg"

    # ── 5 款风格滤镜（StyleFilter）──
    # 🔴 iOS 完全缺失
    style_filters:
      - id: TOON
        display_name: "卡通"         # "卡通" / "Toon"
        asset: "filters/style_toon.jpg"
      - id: SKETCH
        display_name: "素描"         # "素描" / "Sketch"
        asset: "filters/style_sketch.jpg"
      - id: POSTERIZE
        display_name: "色调分离"     # "色调分离" / "Posterize"
        asset: "filters/style_posterize.jpg"
      - id: EMBOSS
        display_name: "浮雕"         # "浮雕" / "Emboss"
        asset: "filters/style_emboss.jpg"
      - id: CROSSHATCH
        display_name: "交叉影线"     # "交叉影线" / "Crosshatch"
        asset: "filters/style_crosshatch.jpg"

  # ── 互斥逻辑：色调和风格不能同时选中 ──
  selection_rule:
    when_color_selected: "selectedStyleFilter = NONE"
    when_style_selected: "selectedFilter = NONE"

  # ── 滤镜缩略图项样式 ──
  item_style:
    thumbnail:
      shape: circle                  # 圆形缩略图
      image_size: "itemWidth * 0.72" # 图片尺寸 = item 宽 × 0.72
      scale: crop                    # ContentScale.Crop
      fallback: "radial_gradient(surfaceVariant, onSurface_alpha_20)"
    selected_border:
      width: 2.5                     # 2.5dp
      brush: linear_gradient         # primary → onSurface 线性渐变
      colors: ["colorScheme.primary", "colorScheme.onSurface"]
    unselected_border:
      width: 1
      brush: linear_gradient
      colors: ["onSurface_alpha_30", "onSurface_alpha_10"]
    selected_overlay:
      mask: "primary_alpha_25"       # primary 25% 透明遮罩
      check_icon:
        material: check              # Icons.Rounded.Check
        sf_symbol: "checkmark"
        tint: "colorScheme.primary"
        size: "imageSize * 0.38"
    scale_animation:
      selected: 1.08                 # 选中时 1.08x 放大
      unselected: 1.0
    label:
      size: 10                       # 10sp
      selected_style:
        color: "colorScheme.primary"
        weight: bold
      unselected_style:
        color: "onSurface_alpha_85"
        weight: medium               # Medium
      max_lines: 1

# ============================================================================
# 10. 比例选择器面板（RatioSelector）
# ============================================================================
ratio_panel:
  trigger: ratio_switch
  anchor: bottom_sheet               # 复用 ControlPanel
  container:
    # 同滤镜面板容器样式
    top_corner_radius: 24
    shadow_elevation: 16
    panel_height_ratio: 0.5
    drag_handle: standard
    padding_horizontal: 24
    padding_vertical: 12
  layout: row
  spacing: 16                        # 按钮间距 16dp
  items:
    - id: ratio_4_3
      label: "4:3"                   # "4:3"
      value: 0                       # AspectRatio.RATIO_4_3
      style:
        type: button                 # Material Button
        selected:
          container_color: "colorScheme.primary"
          text_color: "colorScheme.onPrimary"
        unselected:
          container_color: "dark_gray"  # Color.DarkGray
          text_color: "colorScheme.onSurface"
        text_size: 12                # 12sp
        padding: "horizontal=12dp, vertical=8dp"

    - id: ratio_16_9
      label: "16:9"                  # "16:9"
      value: 1

    - id: ratio_full
      label: "全屏"                  # "全屏" / "FULL"
      value: 2
  behavior:
    on_select: "set_aspect_ratio + close_panel"  # 选择后立即关闭面板

# ============================================================================
# 11. 场景选择器面板（SceneSelector）
