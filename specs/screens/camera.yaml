# ============================================================================
# 相机屏完整产品规格书（Camera Screen Spec）
# ============================================================================
# 基准端：双端对等实现（2026-08-15 顶部工具栏改版后结构与 iOS CameraPreviewView.swift 对齐）
#        Android CameraScreen.kt / CameraPreviewContent.kt / CameraControls.kt
#        / CameraControlButtons.kt / BeautyPanel.kt / FilterSelector.kt
#        / CameraBaseComponents.kt / ProModeControls.kt / ColorSelectors.kt
#        / CameraOverlays.kt / CameraRuntimeState.kt
# 用途：双端实现与验收的唯一输入（结构零容差一致，平台材质各自原生）
# 值引用：尺寸引用 design-tokens.json 的 token 名（如 topBar.height），数值在注释中标注
# 颜色引用：appColors.* 对应 design-tokens.json color 节点
# 图标映射：Material Icons (Android) → SF Symbols (iOS)
#
# ── SSOT 分工（2026-08-15 修订：codegen 工作流，原 Figma SSOT 方案已废止）──
# 本文件只留：行为/状态机/交互规则/内容数据（色板等）+ 触发与绑定。
# 样式值（尺寸/颜色/圆角/间距）SSOT = design-tokens.json，双端代码由 scripts/gen-design-tokens.py
#   生成（禁手改；ai-gate --check 门禁）；改 token 只改 JSON 再重跑生成器。
# 可视化预览（非 SSOT）：build/design-tokens/ardot-variables.json 经 Ardot MCP apply_variables
#   推入画布做「token 活体预览」；Figma「PoLang UI Spec」仅作历史参考，不再维护。
# Arbot 作为首选设计预览/迭代工具：结构与样式可视化以 Arbot 画布为准，最终以 token JSON 落地。
# 地面真值:specs/screens/refs/android/camera-<state>.{png,txt}(真机截图+a11y 实测)。
# ⚠️ 教训:文案/结构以 a11y 实测为准,勿从本 yaml 推测(曾致 FULL/三分/黄金 全错)。
# 瘦身进度:beauty_panel 段已完成(模板),其余段随对齐推进逐步瘦身。

# ============================================================================
# 1. 总体结构
# ============================================================================
root:
  type: full_screen          # 全屏 Box
  background: "#000000"      # 纯黑底色
  fill_strategy: edge_to_edge # 预览延伸至屏幕物理边缘（四边）
  layout: zstack             # ZStack（层叠），预览在底层，所有控件浮在预览之上
  click_to_dismiss:
    enabled_when: any_panel_open  # 任何面板打开时，点击预览空白处关闭面板
    action: close_all_panels       # ProPanel 单独关闭，其余一键全关

# ============================================================================
# 2. 系统栏状态
# ============================================================================
status_bar:
  visible: false              # 沉浸式隐藏（Android: WindowInsetsControllerCompat.hide(systemBars)）
  content_color: light        # iOS: lightContent（浅色图标，黑底白字）
  ios_note: ".ignoresSafeArea() + preferredStatusBarStyle = .lightContent"

home_indicator:
  defer_gestures: true        # iOS: preferredScreenEdgesDeferringSystemGestures（底部上划需二次确认才回桌面）
  android_immersive: true     # Android: 沉浸模式，边缘二次确认

# Back 栈优先级链（Back 按键 / 手势返回）
back_stack:
  - condition: panel_expanded  # 有面板展开时
    action: close_panel         # Back 先关面板（不分类型，全关）
  - condition: default          # 无面板时
    action: exit_camera         # Back 退出相机

# ============================================================================
# 3. 顶部左侧控件组（CameraLeftControls）
# ============================================================================
# 位置：Alignment.TopStart，避让状态栏/刘海区域
# 🔴 系统栏隐藏时避让语义：相机页沉浸式 hide(systemBars) 后 Type.statusBars inset 归零，
#    Android 必须用 statusBarsIgnoringVisibility，iOS 用 safeTop 锚定（2026-08-09 刘海屏修复）
# 🔴 2026-08-15 顶部居中工具栏（§4）上线后，左列需再向下避让工具栏高度（约 48dp），防止与工具栏重叠
# 布局：Column，spacing = 8dp（topBar.spacing），padding = 16dp
top_left_controls:
  anchor: top_start
  layout: column
  padding: 16                 # 外边距 16dp
  top_clearance_below_toolbar: 48  # 工具栏避让：inset + 48dp 后才起排（Android 实现）
  status_bar_padding: ignoring_visibility  # 避让状态栏区域（隐藏时仍生效）
  spacing: 8                  # topBar.spacing = 8dp
  items:
    - id: back_button
      type: ghost_icon_button      # 幽灵样式：无圆形底（2026-08-16 重设计，与顶部文字工具栏同基线）
      size: 40                     # 触达目标 40dp，icon 24dp
      position: top_start_toolbar_baseline  # 左上角，与 §4 工具栏行同基线（inset + topToolBarPaddingTop）
      icon:
        material: arrow_back     # Icons.AutoMirrored.Rounded.ArrowBack
        sf_symbol: "chevron.left"
      icon_size: 24
      content_color: "cameraAccentOn(白)"   # 与工具栏文字同色
      behavior:
        click: navigate_back               # 点击返回（退出相机页）

    # reset_button 已移除（2026-08-16）：「重置相机为首次安装默认状态」迁至设置页「相机」分类
    # （SettingsCategory.CAMERA，带 AlertDialog 二次确认；重置经 cameraMemoryStateFlow 即时水合生效）

    - id: debug_toggle
      type: filled_icon_button
      size: 48
      visible_when: debug_ui_enabled  # 仅 debug 模式显示
      icon:
        material: terminal      # Icons.Rounded.Terminal
        sf_symbol: "terminal"
      icon_size: 24
      behavior:
        click: toggle_log_overlay       # 切换日志覆盖层
      active_state:
        container_color: "colorScheme.primary"
        content_color: "black"
      inactive_state:
        container_color: "black_alpha_50"
        content_color: "white"

    - id: llm_release_button         # 仅 debug 模式
      type: filled_icon_button
      size: 36                       # 比其他按钮小
      visible_when: debug_ui_enabled
      icon:
        material: psychology         # Icons.Rounded.Psychology
        sf_symbol: "brain"
      icon_size: 24
      tint: "#64B5F6"               # 浅蓝色（固定）
      behavior:
        click: release_llm           # 全量释放 LLM 引擎

    - id: face_detect_release_button  # 仅 debug 模式
      type: filled_icon_button
      size: 36
      visible_when: debug_ui_enabled
      icon:
        material: face              # Icons.Rounded.Face
        sf_symbol: "face.smiling"
      icon_size: 24
      tint: "#81C784"              # 浅绿色（固定）
      behavior:
        click: release_face_detect  # 全量释放人脸检测

# ============================================================================
# 4. 顶部居中工具栏（TopToolBar，2026-08-15 改版：右列图标列 → iOS 系统相机风格文字工具栏）
# ============================================================================
# 位置：Alignment.TopCenter，避让状态栏/刘海区域（同 §3 ignoring_visibility 语义）
# 布局：Row 居中，spacing = camera.topToolBarSpacing(6dp)，padding_top = inset + camera.topToolBarPaddingTop(8dp)
# 每个入口 = 文字胶囊：字号 12sp，选中 Bold/未选中 Medium，
#   padding = H camera.topToolBarItemPaddingH(10) V camera.topToolBarItemPaddingV(8)，
#   圆角 camera.topToolBarItemRadius(10)
# 选中态：底 camera.toolBarSelectedBg(=accent；Android=colorScheme.primary)，字 camera.cameraAccentOn(白)
# 未选中：底 camera.toolBarUnselectedBg(透明)，字 白色
# ⚠️ 与 §3 左列（back/refresh/debug）垂直错开：左列需额外 top padding 避让工具栏高度
# 2026-08-16 收窄：spacing 8→6、paddingH 14→10——整组变窄后左缘自然远离左上角返回箭头（间距 ~2dp→~26dp），
#   同时收紧标签间距离（文字间距 36dp→26dp）
# 场景（scene）入口已下线（鸡肋功能，2026-08-15 用户决策）；ScenePreset 状态保留供 Agent 指令链路使用
top_tool_bar:
  anchor: top_center
  layout: row_center
  status_bar_padding: ignoring_visibility
  spacing: 6                      # camera.topToolBarSpacing
  items:
    - id: beauty_entry
      label: "美颜"                # "美颜" / "Beauty"
      selected_when: beauty_panel_open
      behavior:
        click: toggle_beauty_panel
    - id: ratio_entry
      label: "比例"                # "比例" / "Ratio"（短标签 key：camera_tool_ratio）
      selected_when: ratio_panel_open
      behavior:
        click: toggle_ratio_panel
    - id: grid_entry
      label: "辅助线"              # "辅助线" / "Grid"
      selected_when: grid_panel_open
      behavior:
        click: toggle_grid_panel
    - id: filter_entry
      label: "滤镜"                # "滤镜" / "Filter"
      selected_when: filter_panel_open
      behavior:
        click: toggle_filter_panel
    - id: pro_entry
      label: "专业"                # "专业" / "Pro"（短标签 key：camera_tool_pro）
      selected_when: pro_panel_open
      behavior:
        click: toggle_pro_panel

# ── 顶部内联面板（InlineControlPanel）：ratio/grid/filter/pro 点开时挂在工具栏下方 ──
# 外壳：maxWidth 420dp，圆角 camera.panelCornerRadius(16)，iOS=ultraThinMaterial /
#   Android=surface@0.85 + 0.5dp outlineVariant@0.25 描边 + 12dp 阴影；padding H16 V10
# 动画：从顶部滑入 + 淡入；与美颜底部抽屉全互斥（见 §17）
# chip 行样式（ratio/grid 用）：胶囊高 camera.chipHeight(34)、
#   paddingH camera.chipPaddingH(14)、间距 camera.chipSpacing(10)、字号 13 Medium（2026-08-16 由 40/18/12/15 收窄）；
#   选中=accent 底+白字，未选中=白 15% 底+白字；选择后立即收起面板
# pro 面板 WB chips 为平台差异：Android 用 M3 FilterChip（12sp 既有组件），iOS 用同款胶囊 OptionButton（13pt）
inline_panels:
  anchor: below_top_tool_bar
  container:
    max_width: 420
    corner_radius: 16             # camera.panelCornerRadius
    border: "0.5dp outlineVariant_alpha_25"
    shadow_elevation: 12
    padding_horizontal: 16
    padding_vertical: 10
  ratio_panel:
    type: chip_row
    items: ["4:3", "16:9", "全屏"]   # ratio_4_3 / ratio_16_9 / ratio_full
    on_select: "set_aspect_ratio + close_panel"
  grid_panel:
    type: chip_row
    items: ["关闭", "九宫格", "黄金比例"]  # grid_none / grid_thirds / grid_golden
    on_select: "set_grid + close_panel"
  filter_panel:
    type: scroll_grid             # 复用 UnifiedFilterSelector 5 列网格（§9 数据不变）
    max_height: 200               # camera.inlineFilterPanelHeight，内部滚动
  pro_panel:
    type: inline_content          # WB chips + EV/对比度/饱和度/色温滑杆（§13 控件不变，仅容器改为顶部内联）

# ============================================================================
# 5. 预览区
# ============================================================================
preview:
  type: camera_surface
  fill: full_screen                # 全屏填充
  background: "#000000"            # 纯黑底
  aspect_ratio_modes:
    - id: ratio_4_3
      value: 0                      # AspectRatio.RATIO_4_3
      scale_type: fit_center        # FIT_CENTER（留黑边）
      label: "4:3"
    - id: ratio_16_9
      value: 1
      scale_type: fit_center
      label: "16:9"
    - id: ratio_full
      value: 2
      scale_type: fill_center       # FILL_CENTER（裁剪填充全屏）
      label: "FULL"
  default: ratio_full               # 默认 FULL

  # ── 对焦框（FaceFocusCrosshair）──
  # 🔴 iOS 当前最严重对齐项之一：尺寸/颜色/形状/动画全不同
  focus_ring:
    component: "FaceFocusCrosshair"
    outer_size: 100                 # 100dp 外框（固定）
    corner_mark_style: L_shaped     # 4 角 L 型线段（非圆角方框！）
    corner_length: 20               # 每角 L 拐角长度 20dp
    stroke_width: 3                 # L 角线宽 3dp
    color: "#00E5FF"                # appColors.focusRing = #00E5FF（青色/cyan）
    active_alpha: 1.0               # isActive 时 alpha=1.0
    inactive_alpha: 0.5             # 非 active 时 alpha=0.5
    center_cross:
      size: 16                      # 中心十字 16dp
      stroke_width: 2               # 十字线宽 2dp
      alpha: 0.8                    # 十字 alpha=0.8（比角标记淡）
    center_dot:
      radius: 3                     # 中心点圆半径 3dp
      alpha: 1.0                    # 实心
    animation:
      type: spring                  # 弹簧动画（非 ease-out！）
      spec:
        damping_ratio: medium_bouncy  # Spring.DampingRatioMediumBouncy
        stiffness: medium              # Spring.StiffnessMedium
      scale_range:
        visible: 1.0                # alpha > 0.5 时缩放到 1.0
        hidden: 0.6                 # alpha <= 0.5 时缩放到 0.6
    trigger: face_detection         # 联动人脸检测，显示位置为人脸中心
    duration: controlled_by_focus_alpha  # 持续时间由 focusAlpha 状态值控制

# ============================================================================
# 6. 构图网格叠加（CompositionGrid）
# ============================================================================
# 🔴 iOS 完全缺失
composition_grid:
  component: "CompositionGrid"
  full_screen_overlay: true         # 覆盖整个预览区
  modes:
    - id: none
      value: NONE                   # GridType.NONE
      visible: false
    - id: thirds
      value: THIRDS                 # GridType.THIRDS
      description: "三分线（九宫格）"
      lines: 2_vertical + 2_horizontal  # 2 竖线 + 2 横线，均分三等分
    - id: golden
      value: GOLDEN                 # GridType.GOLDEN
      description: "黄金比例线"
      ratio: 0.618                  # 线位置在 0.618 和 (1-0.618)=0.382 处
      lines: 2_vertical + 2_horizontal
  line_style:
    color: "white_alpha_50"         # 白色 50% 透明
    width: 1                        # 1dp 线宽
    dash_pattern: [10, 10]          # 虚线：10px 实线 + 10px 空白
  toggle: via_grid_panel            # 通过网格选择面板切换

# ============================================================================
# 7. 底部控件区（CameraBottomControls）
# ============================================================================
# 位置：Alignment.BottomCenter
# 布局：Column，center 水平对齐
# padding: bottom=20dp, navigationBarsPadding
# spacing: 20dp（行间距）
bottom_area:
  anchor: bottom_center
  layout: column
  horizontal_alignment: center
  padding_bottom: 20
  navigation_bars_padding: true
  row_spacing: 20                   # 行间距 20dp
  background: none                  # 无背景（透明，预览内容直接可见）
  overlay_note: "🔴 面板打开时底栏保持原位被覆盖（Z 序在下），不得条件上移/顶起（2026-08-15 改版确认）"

  # ── 第 1 行：变焦预设条（ZoomControls）──
  # 🔴 iOS 完全缺失
  zoom_presets:
    visible_when: always             # 面板均改为顶部内联/底部覆盖（2026-08-15），变焦条常驻不隐藏
    layout: row_center
    spacing: 12                      # spacing.md = 12dp（按钮间距）
    container:
      shape: rounded_corner_20       # RoundedCornerShape(20dp)
      background: "black_alpha_40"   # 黑 40% 透明底
      padding_horizontal: 12
      padding_vertical: 6
    items:
      - id: zoom_0_6x
        label: "0.6x"
        visible_when: "minZoomRatio <= 0.6"  # 仅设备支持超广角时显示
        selected_when: "zoomRatio < 0.9"
        size: 32                     # 32dp 圆形按钮
        selected_style:
          background: white           # 白底
          text_color: black           # 黑字
        unselected_style:
          background: transparent
          text_color: white
        text_size: 10                # 10sp
        text_weight: bold
        behavior:
          click: set_zoom_ratio(0.6)

      - id: zoom_1x
        label: "1x"
        selected_when: "zoomRatio >= 0.9 && zoomRatio < 1.5"
        default_selected: true
        size: 32
        behavior:
          click: set_zoom_ratio(1.0)

      - id: zoom_2x
        label: "2x"
        selected_when: "zoomRatio >= 1.5 && zoomRatio < 2.8"
        size: 32
        behavior:
          click: set_zoom_ratio(2.0)

      - id: zoom_3_2x
        label: "3.2x"
        visible_when: "maxZoomRatio >= 3.2"  # 仅设备支持时显示
        selected_when: "zoomRatio >= 2.8"
        size: 32
        behavior:
          click: set_zoom_ratio(3.2)

  # ── 第 2 行：模式选择器（ModeSelector）──
  # 🔴 iOS 完全缺失
  mode_selector:
    layout: row_center
    padding_vertical: 8
    items:
      - id: video_mode
        label: "VIDEO"              # 文案常量（三语 i18n）
        capture_mode: VIDEO
        selected_style:
          color: "colorScheme.primary"   # 当前模式 = primary 色
          weight: bold                    # Bold
          size: 13                        # 13sp
        unselected_style:
          color: "white_alpha_60"        # 白 60% 透明
          weight: normal
          size: 13
        padding_horizontal: 12           # 左右各 12dp

      - id: photo_mode
        label: "PHOTO"
        capture_mode: PHOTO
        default_selected: true
        padding_horizontal: 12

      - id: document_mode
        label: "DOCUMENT"
        capture_mode: DOCUMENT
        padding_horizontal: 12

  # ── 第 3 行：快门行（缩略图 | 快门 | 翻转）──
  shutter_row:
    layout: row_space_between_center
    padding_horizontal: 40           # 左右各 40dp
    items:

      # ── 左侧：相册缩略图 ──
      # 🔴 iOS 完全缺失
      - id: gallery_thumbnail
        label: "相册"                  # "相册" / "Gallery"
        shape: circle
        size: 48                       # 48dp 圆形
        background: "dark_gray"        # Color.DarkGray 底（无媒体时）
        content:
          type: latest_media_image     # 最近一张媒体缩略图
          scale: crop                  # ContentScale.Crop
          crossfade: true
        behavior:
          click: navigate_to_gallery   # 跳转相册页
        accessibility_label: "Gallery"

      # ── 中间：快门按钮 ──
      # 🔴 iOS 尺寸差(72 vs 76)、缺录像态、缺防抖
      - id: shutter_button
        shape: circle
        outer_diameter: 76             # shutter.diameter = 76dp
        ring:
          width: 4                     # 4dp 白色圆环边框
          color: "white"               # appColors.shutterRing = #FFFFFFFF
        inner_padding: 6               # 圆环与内填之间 6dp padding
        inner_diameter: 58             # shutter.innerDiameter = 58dp
        # 内填颜色随模式变化
        inner_color:
          photo_mode: "white"          # 拍照 = 白色填充
          video_mode: "red"            # 录像 = 红色填充（Color.Red）
        # 录像态：内填变为 28dp 白色圆角方块
        recording_state:
          visible_when: "isRecording"
          center_block:
            size: 28                   # 28dp 白色圆角方块
            corner_radius: 4           # RoundedCornerShape(4dp)
            color: "white"
        debounce:
          interval_ms: 500             # 500ms 防抖（lastClickTime 模式）
        accessibility_label: "Shutter"

      # ── 右侧：翻转摄像头 ──
      # 🔴 iOS 完全缺失
      - id: flip_camera
        label: "翻转"                  # "翻转" / "Flip"
        shape: circle
        size: 48                       # 48dp 圆形
        background: "white_alpha_20"   # 白 20% 透明底
        icon:
          material: cameraswitch       # Icons.Rounded.Cameraswitch
          sf_symbol: "camera.rotate"
        icon_color: white
        behavior:
          click: flip_camera           # 切换前/后摄

  # ── 快门闪屏动画 ──
  # 🔴 iOS 完全缺失
  shutter_flash:
    type: full_screen_overlay        # 全屏黑色覆盖层
    color: black
    animation:
      property: opacity              # Animatable(0f) → 0→1→0
      trigger: on_photo_captured     # 拍照触发
      duration: "闪一下（短暂 opacity 峰值后回落）"

# ============================================================================
# 8. 美颜面板（BeautyPanel）
# ============================================================================
# 🔴 iOS 缺 Tab 切换、缺拖拽手柄、缺滑杆图标/数值/重置、缺整个 MAKEUP Tab
beauty_panel:
  trigger: top_tool_bar.beauty_entry  # 顶部居中工具栏「美颜」入口触发（§4）
  anchor: bottom_sheet
  overlay_behavior: cover_not_push     # 🔴 覆盖底栏（Z 序在上），不顶起其他 UI；底栏 padding 固定
  animation:
    enter: slide_in_vertically + fade_in   # 从底部滑入 + 淡入
    exit: slide_out_vertically + fade_out
  # ── 视觉 SSOT=design-tokens.json:高度40%/clamp、容器圆角/底色/渐变/边框/阴影、内边距/间距
  #    (token beautyPanel.heightRatio=0.40(容下磨皮/美白/瘦脸/大眼 4 行滑杆+Tab 栏)/bottomSheet,
  #     经 gen-design-tokens.py 生成双端常量)──
  scrollable: true                   # 内容可垂直滚动(行为)

  # ── 拖拽手柄(行为:存在且可点关闭;形状 36×4 → token bottomSheet.handleWidth/Height)──
  drag_handle:
    position: top_center
    on_tap: close_panel

  # ── 底部 Tab 栏 ──
  # ✅ iOS 已还原(2026-08-15:文字标签 面部精修/妆容调节 + accessibilityLabel);
  #    选中/未选中样式 → token。标签以 a11y 实测为准(妆容调节,非"妆容")
  tab_bar:
    position: panel_bottom           # 面板底部固定
    tabs:
      - id: face_tab
        label: "面部精修"
        icon: { material: face_retouching_natural, sf_symbol: "face.smiling" }
      - id: makeup_tab
        label: "妆容调节"            # a11y 实测(Android 真机 dump)
        icon: { material: color_lens, sf_symbol: "paintpalette" }

  # ── FACE Tab 内容：4 条滑杆 ──
  # 通用行为:点击「图标+标签」行 → 重置该项为 0;数值显示整数(含 0——a11y 实测瘦脸0显示"0",非"--")
  # 视觉(AppSlider 胶囊轨道/图标尺寸/配色)→ token appSlider/beautyPanel
  face_tab_sliders:

    - id: smoothing
      label: "磨皮"
      icon: { material: face, sf_symbol: "face.smiling" }
      value_range: [0, 100]
      default_value: 0
      display_format: integer
      reset_value: 0

    - id: whitening
      label: "美白"
      icon: { material: auto_fix_high, sf_symbol: "wand.and.stars" }
      value_range: [0, 100]
      default_value: 0
      display_format: integer
      reset_value: 0

    - id: slim_face
      label: "瘦脸"
      icon: { material: face_retouching_natural, sf_symbol: "face.dashed" }
      value_range: [-50, 50]         # 唯一支持负值
      default_value: 0
      display_format: signed_integer
      reset_value: 0

    - id: big_eyes
      label: "大眼"
      icon: { material: visibility, sf_symbol: "eye" }
      value_range: [0, 100]
      default_value: 0
      display_format: integer
      reset_value: 0

  # ── MAKEUP Tab 内容:色板/数据保留(内容色板属产品数据),布局/样式 → token
  #     camera/panel_beauty_makeup。iOS 现状:tab 已有,内容仍占位(MakeupPlaceholderContent)
  makeup_tab_content:

    # ── 唇彩选择器(行为:点击图标+标签行重置;强度滑杆)──
    lip_color:
      label: "唇彩"
      click_to_reset: true
      color_palette:                 # 12 色调色板(2 行;视觉→token)
        rows: 2
        colors:
          - "#D4757D"  # 珊瑚粉
          - "#C43343"  # 正红
          - "#FF7F50"  # 珊瑚橙
          - "#E0527C"  # 玫红
          - "#FF6B9D"  # 粉红
          - "#9B2335"  # 深红
          - "#FFA07A"  # 浅鲑鱼色
          - "#CD5C5C"  # 印度红
          - "#DC143C"  # 猩红
          - "#FFB6C1"  # 浅粉
          - "#B22222"  # 火砖红
          - "#FF1493"  # 深粉
        default_selected_index: 0
      strength_slider:
        value_range: [0, 100]
        default_value: 0
        reset_value: 0

    # ── 腮红色系(标签以 a11y 实测为准:梅子色,非"梅色";样式→token)──
    blush_color_family:
      label: "腮红色系"
      families:
        - { id: pink, label: "粉色", color_dot: "#FF8DAA" }
        - { id: orange, label: "橙色", color_dot: "#FFA85C" }
        - { id: plum, label: "梅子色", color_dot: "#9B3D6A" }
      default_selected_index: 0

    # ── 腮红强度滑杆 ──
    blush_slider:
      label: "腮红"
      icon: { material: favorite_border, sf_symbol: "heart" }
      value_range: [0, 100]
      default_value: 0
      display_format: integer
      reset_value: 0
      click_to_reset: true

# ============================================================================
# 9. 滤镜面板（UnifiedFilterSelector，2026-08-15 改为顶部内联面板，见 §4 inline_panels）
# ============================================================================
filter_panel:
  trigger: top_tool_bar.filter_entry
  anchor: top_inline                 # 顶部工具栏下方内联面板（InlineControlPanel 外壳）
  container: see_inline_panels       # 外壳样式统一见 §4 inline_panels.container

  grid:
    layout: vertical_grid            # LazyVerticalGrid（内部滚动）
    columns: 5                       # 固定 5 列
    height: 200                      # camera.inlineFilterPanelHeight = 200dp（内联面板内滚动）
    padding_vertical: 8
    horizontal_spacing: 4
    vertical_spacing: 8
    content_padding_horizontal: 12
    item_width: "(screenWidth - 20dp) / 5"  # 动态计算

  filter_list:
    # ── 9 款色调滤镜（FilterType）──
    color_filters:
      - id: NONE
        display_name: "原图"         # "原图" / "None"
        asset: "filters/filter_none.jpg"
      - id: LEICA_CLASSIC
        display_name: "经典"         # "经典" / "Leica Classic"
        asset: "filters/filter_leica_classic.jpg"
      - id: LEICA_VIBRANT
        display_name: "鲜艳"         # "鲜艳" / "Leica Vibrant"
        asset: "filters/filter_leica_vibrant.jpg"
      - id: LEICA_BW
        display_name: "黑白"         # "黑白" / "Leica B&W"
        asset: "filters/filter_leica_bw.jpg"
      - id: FILM_GOLD
        display_name: "金胶片"       # "金胶片" / "Film Gold"
        asset: "filters/filter_film_gold.jpg"
      - id: FILM_FUJI
        display_name: "富士"         # "富士" / "Film Fuji"
        asset: "filters/filter_film_fuji.jpg"
      - id: VINTAGE
        display_name: "复古"         # "复古" / "Vintage"
        asset: "filters/filter_vintage.jpg"
      - id: COOL
        display_name: "冷调"         # "冷调" / "Cool"
        asset: "filters/filter_cool.jpg"
      - id: WARM
        display_name: "暖调"         # "暖调" / "Warm"
        asset: "filters/filter_warm.jpg"

    # ── 5 款风格滤镜（StyleFilter）──
    # 🔴 iOS 完全缺失
    style_filters:
      - id: TOON
        display_name: "卡通"         # "卡通" / "Toon"
        asset: "filters/style_toon.jpg"
      - id: SKETCH
        display_name: "素描"         # "素描" / "Sketch"
        asset: "filters/style_sketch.jpg"
      - id: POSTERIZE
        display_name: "色调分离"     # "色调分离" / "Posterize"
        asset: "filters/style_posterize.jpg"
      - id: EMBOSS
        display_name: "浮雕"         # "浮雕" / "Emboss"
        asset: "filters/style_emboss.jpg"
      - id: CROSSHATCH
        display_name: "交叉影线"     # "交叉影线" / "Crosshatch"
        asset: "filters/style_crosshatch.jpg"

  # ── 互斥逻辑：色调和风格不能同时选中 ──
  selection_rule:
    when_color_selected: "selectedStyleFilter = NONE"
    when_style_selected: "selectedFilter = NONE"

  # ── 滤镜缩略图项样式 ──
  item_style:
    thumbnail:
      shape: circle                  # 圆形缩略图
      image_size: "itemWidth * 0.72" # 图片尺寸 = item 宽 × 0.72
      scale: crop                    # ContentScale.Crop
      fallback: "radial_gradient(surfaceVariant, onSurface_alpha_20)"
    selected_border:
      width: 2.5                     # 2.5dp
      brush: linear_gradient         # primary → onSurface 线性渐变
      colors: ["colorScheme.primary", "colorScheme.onSurface"]
    unselected_border:
      width: 1
      brush: linear_gradient
      colors: ["onSurface_alpha_30", "onSurface_alpha_10"]
    selected_overlay:
      mask: "primary_alpha_25"       # primary 25% 透明遮罩
      check_icon:
        material: check              # Icons.Rounded.Check
        sf_symbol: "checkmark"
        tint: "colorScheme.primary"
        size: "imageSize * 0.38"
    scale_animation:
      selected: 1.08                 # 选中时 1.08x 放大
      unselected: 1.0
    label:
      size: 10                       # 10sp
      selected_style:
        color: "colorScheme.primary"
        weight: bold
      unselected_style:
        color: "onSurface_alpha_85"
        weight: medium               # Medium
      max_lines: 1

# ============================================================================
# 10. 比例选择器面板（2026-08-15 改为顶部内联 chip 行，见 §4 inline_panels.ratio_panel）
# ============================================================================
ratio_panel:
  trigger: top_tool_bar.ratio_entry
  anchor: top_inline                 # InlineControlPanel + chip 胶囊行
  layout: chip_row                   # 胶囊高 34 / paddingH 14 / 间距 10 / 字号 13 Medium（样式见 §4）
  items:
    - id: ratio_4_3
      label: "4:3"                   # "4:3"
      value: 0                       # AspectRatio.RATIO_4_3
    - id: ratio_16_9
      label: "16:9"                  # "16:9"
      value: 1
    - id: ratio_full
      label: "全屏"                  # "全屏" / "FULL"
      value: 2
  behavior:
    on_select: "set_aspect_ratio + close_panel"  # 选择后立即关闭面板

# ============================================================================
# 11. 场景选择器面板（已下线，2026-08-15：鸡肋功能，双端移除入口与面板）
# ============================================================================
# ScenePreset 枚举与 Agent 指令链路（set_scene 能力）保留，仅 UI 入口/面板删除。
scene_panel: removed

# ============================================================================
# 12. 网格选择器面板（2026-08-15 改为顶部内联 chip 行，见 §4 inline_panels.grid_panel）
# ============================================================================
grid_panel:
  trigger: top_tool_bar.grid_entry
  anchor: top_inline                 # InlineControlPanel + chip 胶囊行
  layout: chip_row
  items:
    - id: grid_none
      label: "关闭"                  # "关闭" / "Off"
      value: NONE                    # GridType.NONE
    - id: grid_thirds
      label: "九宫格"                # "九宫格" / "Thirds"
      value: THIRDS                  # GridType.THIRDS
    - id: grid_golden
      label: "黄金比例"              # "黄金比例" / "Golden"
      value: GOLDEN                  # GridType.GOLDEN
  behavior:
    on_select: "set_grid + close_panel"

# ============================================================================
# 13. ProMode 面板（ProModeControls，2026-08-15 改为顶部内联面板，见 §4 inline_panels.pro_panel）
# ============================================================================
pro_mode_panel:
  trigger: top_tool_bar.pro_entry
  anchor: top_inline                 # InlineControlPanel 外壳，内容自适应不滚动
  animation:
    enter: slide_in_from_top + fade_in
    exit: slide_out_to_top + fade_out
  # 控件清单不变（WB chips + EV/对比度/饱和度/色温滑杆），仅容器由底部半屏改为顶部内联

  controls:

    # ── 白平衡（LazyRow FilterChip 横滑选择）──
    - id: white_balance
      label: "白平衡"                # "白平衡" / "White Balance"
      label_color: "onSurface_alpha_70"
      label_size: 12
      layout: lazy_row
      spacing: 8
      # 生效机制（2026-08-16 第二版）：WB 预设 → BeautySettings.temperature 色温映射，
      # 经 GL/Metal 调色管线（colorgrade.glsl uTemperature，系数 0.05）实时生效，预览/拍照同管线所见即所得。
      # 弃用 Camera2 CONTROL_AWB_MODE 的原因：真机实测（小米 HyperOS）CameraX 上报 applied 成功
      # 但 HAL 实际忽略，预览/成片均无变化；GL 方案跨设备行为一致。
      # 映射（补偿方向：暖光预设输出偏冷，冷光预设输出偏暖）：
      #   0 自动=5000K(中性) 1 晴天=5600K 2 阴天=6200K 3 白炽灯=3600K 4 荧光灯=4400K
      # 与色温滑杆的关系：WB 预设即往色温写预设值；手动拖色温滑杆则退出预设选中态（chip 回「自动」）。
      modes:
        - value: 0
          label: "自动"              # "自动" / "Auto"（色温 5000K 中性）
        - value: 1
          label: "晴天"              # "晴天" / "Sunny"（色温 5600K）
        - value: 2
          label: "阴天"              # "阴天" / "Cloudy"（色温 6200K）
        - value: 3
          label: "白炽灯"            # "白炽灯" / "Incandescent"（色温 3600K）
        - value: 4
          label: "荧光灯"            # "荧光灯" / "Fluorescent"（色温 4400K）
      chip_style:                    # FilterChip
        selected:
          container_color: "colorScheme.primary"
          label_color: "colorScheme.onPrimary"   # 动态取色下保证对比度（原为 black，2026-08-15 修正）
        unselected:
          container_color: "onSurface_alpha_06"
          label_color: "onSurface_alpha_70"
        text_size: 12
        max_lines: 1

    # ── 曝光 EV 滑杆 ──
    - id: exposure_ev
      label: "曝光"                  # "曝光" / "Exposure"
      type: pro_mode_slider          # 标签+数值在 Row，下方滑杆
      value_range: "exposureRange.first..exposureRange.last"  # 动态范围（设备相关）
      steps: "exposureRange.last - exposureRange.first - 1"     # 离散步进
      display_format:
        positive: "+value"           # 正值显示 +N
        negative: "value"            # 负值显示 N
        zero: "0"
      is_default: "exposure == 0"
      default_display: "--"          # 默认显示 "--"
      slider_height: 36
      label_color: "onSurface_alpha_70"
      value_color:
        changed: "colorScheme.primary"
        default: "onSurface_alpha_35"

    # ── 0.5dp 分隔线 ──
    - id: divider
      type: horizontal_divider
      height: 0.5
      color: "onSurface_alpha_10"

    # ── 对比度滑杆 ──
    - id: contrast
      label: "对比度"                # "对比度" / "Contrast"
      type: pro_mode_slider
      value_range: [0, 200]
      default_value: 50              # 默认 50
      display_format: integer
      is_default: "abs(contrast - 50) <= 0.5"
      default_display: "--"
      slider_height: 36

    # ── 饱和度滑杆 ──
    - id: saturation
      label: "饱和度"                # "饱和度" / "Saturation"
      type: pro_mode_slider
      value_range: [0, 200]
      default_value: 100             # 默认 100
      display_format: integer
      is_default: "abs(saturation - 100) <= 0.5"
      default_display: "--"
      slider_height: 36

    # ── 色温滑杆 ──
    - id: color_temperature
      label: "色温"                  # "色温" / "Color Temperature"
      type: pro_mode_slider
      value_range: [2000, 8000]      # 2000K..8000K
      default_value: 5000            # 默认 5000K
      display_format: "valueK"       # 带 K 后缀，如 "5500K"
      is_default: "abs(temperature - 5000) <= 50"
      default_display: "--"
      slider_height: 36

# ============================================================================
# 14. 右下角浮动 FAB（CameraFloatingActionButtons）
# ============================================================================
# 🔴 iOS 完全缺失
floating_actions:
  anchor: bottom_end                 # Alignment.BottomEnd
  layout: column
  spacing: 12                        # spacing.md = 12dp
  padding:
    end: 16                          # spacing.lg = 16dp
    bottom: 180                      # 避让底部控件区
  navigation_bars_padding: true
  horizontal_alignment: end

  items:

    # ── 语音控制 FAB ──
    # 仅设置中开启「语音控制入口」时显示
    - id: voice_fab
      visible_when: voice_entry_enabled  # uiState.voiceEntryEnabled
      shape: circle
      size: 52                       # 52dp
      container_color:
        active: "colorScheme.primary"    # 语音控制启用时
        inactive: "black_alpha_60"       # 未启用时
      icon:
        material: record_voice_over  # Icons.Rounded.RecordVoiceOver
        sf_symbol: "waveform"
        size: 24                     # icon.lg = 24dp
        tint: white
      # 耳机连接状态角标
      headset_badge:
        visible_when: headset_or_bluetooth_connected
        position: top_end
        size: 16                     # 16dp
        background: "surface_alpha_90"
        icon:
          material: headphones       # Icons.Rounded.Headphones
          sf_symbol: "headphones"
          size: 12
        tint:
          bluetooth: "#4FC3F7"       # 浅蓝
          wired: "#81C784"           # 浅绿

    # ── AI Chat FAB ──
    - id: ai_chat_fab
      shape: circle
      size: 52                       # 52dp
      container_color: "colorScheme.primary"  # 始终 primary 色
      icon:
        material: keyboard_voice     # Icons.Rounded.KeyboardVoice
        sf_symbol: "mic.fill"
        size: 24                     # icon.lg = 24dp
        tint: white

# ============================================================================
# 15. 唤醒词状态指示器（VoiceWakeIndicator）
# ============================================================================
# 顶部居中，语音唤醒监听状态提示
wake_word_indicator:
  position: top_center
  visible_when: isWakeWordActive
  # P2 辅助功能，具体样式由 VoiceWakeIndicator 组件定义

# ============================================================================
# 16. 文档检测覆盖层（DocumentDetectionOverlay）
# ============================================================================
document_overlay:
  visible_when: "captureMode == DOCUMENT && !isAnyPanelOpen"
  full_screen: true
  # 显示文档边缘检测框，具体样式由 DocumentDetectionOverlay 组件定义

# ============================================================================
# 17. 面板状态机（互斥逻辑，2026-08-15 改版：统一互斥，无独立轨道）
# ============================================================================
# 所有面板（含美颜底部抽屉 + 4 个顶部内联面板）同属一个互斥组，同时最多开 1 个。
panel_state_machine:
  description: |
    单一互斥组：beauty / ratio / grid / filter / pro 五面板同时最多 1 个可见。
    点开任一面板 = 关闭其余全部；再次点击同一入口 = 收起。
    （2026-08-15 前为「Primary 轨道 + ProMode 独立轨道」双轨制，已随顶部工具栏改版统一）

  panels:
    members:
      - beauty_panel     # showBeautySelector（底部抽屉）
      - filter_panel     # showFilterSelector（顶部内联）
      - ratio_panel      # showRatioSelector（顶部内联）
      - grid_panel       # showGridSelector（顶部内联）
      - pro_mode_panel   # showProPanel（顶部内联）
    mutex_rule: |
      togglePanel(panel):
        1. nextVisibility = !panel.isVisible
        2. closeAllPanels()         ← 关闭全部 5 个面板（含 showProPanel）
        3. panel.isVisible = nextVisibility
      结果：同一时刻最多 1 个面板可见

  dismiss_rules:
    # 点击预览空白处
    click_blank_area:
      enabled_when: any_panel_open
      action: close_all_panels       # 全关（含 pro）
    # Back 按键
    back_button:
      action: close_all_panels       # 全关

  isAnyPanelOpen_definition: |
    isAnyPanelOpen = showFilterSelector || showRatioSelector || showGridSelector
    （顶部内联面板集合，不含 showBeautySelector、不含 showProPanel；
      仅用于文档检测覆盖层等次要抑制逻辑，不再承担面板互斥职责）

# ============================================================================
# 18. 所有状态枚举
# ============================================================================
states:

  # ── 拍照模式 ──
  capture_mode:
    - VIDEO
    - PHOTO                          # 默认
    - DOCUMENT

  # ── 比例 ──
  aspect_ratio:
    - RATIO_4_3                      # value=0, FIT_CENTER
    - RATIO_16_9                     # value=1, FIT_CENTER
    - RATIO_FULL                     # value=2, FILL_CENTER（默认）

  # ── 网格 ──
  grid_type:
    - NONE                           # 默认
    - THIRDS                         # 三分线
    - GOLDEN                         # 黄金比例

  # ── 场景 ──
  scene_preset:
    - NONE                           # 默认
    - NIGHT                          # 夜景
    - MOON                           # 月亮

  # ── 滤镜（色调 9 款）──
  filter_type:
    - NONE                           # 默认（原图）
    - LEICA_CLASSIC
    - LEICA_VIBRANT
    - LEICA_BW
    - FILM_GOLD
    - FILM_FUJI
    - VINTAGE
    - COOL
    - WARM

  # ── 滤镜（风格 5 款）──
  style_filter:
    - NONE                           # 默认
    - TOON
    - SKETCH
    - POSTERIZE
    - EMBOSS
    - CROSSHATCH

  # ── 面板可见状态（互斥组）──
  panel_visibility:
    mutex_group:                     # 统一互斥（2026-08-15 改版），同时最多 1 个为 true
      showBeautySelector: false      # 美颜面板（底部抽屉）
      showFilterSelector: false      # 滤镜面板（顶部内联）
      showRatioSelector: false       # 比例面板（顶部内联）
      showGridSelector: false        # 网格面板（顶部内联）
      showProPanel: false            # ProMode 面板（顶部内联）
    removed:
      showSceneSelector: "场景面板已下线（2026-08-15），字段保留供状态兼容，不再渲染"

  # ── 美颜 Tab ──
  beauty_tab:
    - FACE                           # 面部精修（默认）
    - MAKEUP                         # 妆容

  # ── 腮红色系 ──
  blush_color_family:
    - 0                              # 粉色 Pink (#FF8DAA)
    - 1                              # 橙色 Orange (#FFA85C)
    - 2                              # 梅色 Plum (#9B3D6A)

  # ── 白平衡模式 ──
  white_balance:
    - 0                              # Auto
    - 1                              # Sunny
    - 2                              # Cloudy
    - 3                              # Incandescent
    - 4                              # Fluorescent

  # ── 镜头朝向 ──
  lens_facing:
    - 0                              # 前摄 (FRONT)
    - 1                              # 后摄 (BACK)（默认）

  # ── 页面交互状态 ──
  interaction_state:
    - idle                           # 默认：预览 + 顶部按钮 + 底部控件
    - panel_open                     # 面板展开（Back/空白点击关闭）
    - capturing                      # 拍照中（快门动画+闪屏，交互禁用）
    - recording                      # 录像中（快门变红底方块）
    - focusing                       # 对焦中（focus_ring 显示）

# ============================================================================
# 19. 美颜设置默认值（BeautySettings）
# ============================================================================
beauty_settings_defaults:
  enabled: false                     # 美颜总开关，默认关
  smoothing: 0                      # 磨皮 0-100
  whitening: 0                      # 美白 0-100
  slimFace: 0                       # 瘦脸 -50~50
  bigEyes: 0                        # 大眼 0-100
  lipColor: 0                       # 唇彩强度 0-100（DEFAULT_LIP_COLOR = 0）
  lipColorIndex: 0                  # 唇彩色号索引 0-11
  blush: 0                          # 腮红强度 0-100（DEFAULT_BLUSH = 0）
  blushColorFamily: 0               # 腮红色系 0-2
  contrast: 50                      # 对比度 0-200（默认 50）
  saturation: 100                   # 饱和度 0-200（默认 100）
  temperature: 5000                 # 色温 2000-8000K（默认 5000）

# ============================================================================
# 20. 允许的平台差异
# ============================================================================
allowed_differences:
  - dimension: font
    android: Roboto
    ios: SF Pro
    note: "字体族差异可接受"

  - dimension: icon_set
    android: Material Icons (Icons.Rounded.*)
    ios: SF Symbols
    note: "语义一致即可，尺寸/颜色保持一致"
    mapping_examples:
      arrow_back: "chevron.left"
      refresh: "arrow.clockwise"
      auto_fix_high: "wand.and.stars"
      aspect_ratio: "aspectratio"
      grid_on: "square.grid.3x3"
      landscape: "mountain.2"
      filter_b_and_w: "camera.filters"
      tune: "slider.horizontal.3"
      cameraswitch: "camera.rotate"
      record_voice_over: "waveform"
      keyboard_voice: "mic.fill"

  - dimension: focus_animation_curve
    android: "Spring(DampingRatioMediumBouncy, StiffnessMedium)"
    ios: "iOS spring animation（近似弹性参数）"
    note: "动画曲线细节可各用平台原生"

  - dimension: shutter_feedback
    android: "可选振动（Vibrator）"
    ios: "Haptic Feedback（UIImpactFeedbackGenerator）"
    note: "触觉反馈各用平台原生"

  - dimension: panel_material
    android: "surface.copy(alpha=0.85) + 0.5dp outlineVariant@0.25 描边 + 12dp 阴影（InlineControlPanel）"
    ios: ".ultraThinMaterial（毛玻璃）或近似"
    note: "面板背景材质差异可接受；内联面板圆角统一 camera.panelCornerRadius = 16dp/pt（见 §4 inline_panels）"

  - dimension: filter_selected_border
    android: "linearGradient(primary, onSurface) 2.5dp"
    ios: "AngularGradient 近似或实色 accentColor 2.5pt"
    note: "渐变 vs 实色风格差异可接受"

  - dimension: preview_zoom_gesture
    note: "iOS 可保留 pinch-to-zoom（MagnificationGesture）作为原生增强，但必须同时有底部预设按钮条"

# ============================================================================
# 21. 平台差异台账（ios-follow 契约层）
# ============================================================================
platform_differences:
  permission:
    android:
      - "android.permission.CAMERA"
      - "android.permission.RECORD_AUDIO"              # 录像模式
      - "android.permission.WRITE_EXTERNAL_STORAGE"    # Android 9 及以下保存媒体
      - "android.permission.READ_MEDIA_IMAGES"         # Android 13+ 读取媒体
      - "android.permission.READ_MEDIA_VIDEO"          # Android 13+ 读取媒体
    ios:
      - "NSCameraUsageDescription"                     # 相机预览/拍照/录像
      - "NSMicrophoneUsageDescription"                 # 录像收音
      - "NSPhotoLibraryAddUsageDescription"            # 仅保存照片/视频
      - "NSPhotoLibraryUsageDescription"               # 若需读取最近缩略图
    note: "iOS 权限粒度为 Full/Limited/AddOnly/Denied；相册缩略图读取需 PHPhotoLibrary 授权，保存仅需 AddOnly。"

  capabilities:
    - capability: camera_preview
      android: "CameraX Preview use case + OpenGL/Engines 美颜管线"
      ios: "AVFoundation AVCaptureVideoPreviewLayer + Metal 4-pass 美颜管线"
      note: "预览框架差异可接受，取景比例/控件层级/面板行为必须按本 spec 对齐。"

    - capability: face_detection
      android: "MNN RetinaFace / MediaPipe Face Mesh（ engines 模块）"
      ios: "MNN RetinaFace / MediaPipe Face Mesh（ Frameworks _embed）"
      note: "双端共用 106pt 关键点规范，坐标系按 coordinate-system-standard 换算。"

    - capability: photo_capture
      android: "CameraX ImageCapture"
      ios: "AVCapturePhotoOutput"
      note: "快门交互、闪屏动画、防抖行为按本 spec 对齐。"

    - capability: video_capture
      android: "CameraX VideoCapture"
      ios: "AVCaptureMovieFileOutput"
      note: "iOS 当前版本如未实现录像，需在台账中标记为后续版本支持。"

    - capability: beauty_adjustment
      android: "OpenGL beauty pass + 滑杆参数绑定"
      ios: "Metal beauty pass + 滑杆参数绑定"
      note: "参数语义与默认值双端一致，具体算法实现可平台原生。"

    - capability: gallery_thumbnail
      android: "读取 MediaStore 最近一张媒体作为缩略图"
      ios: "读取 PHPhotoLibrary 最近一张资源作为缩略图"
      note: "无媒体时均显示 dark_gray 占位圆。"

    - capability: camera_switch
      android: "CameraSelector LENS_FACING_FRONT/BACK"
      ios: "AVCaptureDevice.DiscoverySession + AVCaptureDevicePosition"
      note: "切换动画与按钮状态按本 spec 对齐。"

    - capability: white_balance
      android: "WB 预设 → BeautySettings.temperature 色温映射（5000/5600/6200/3600/4400K），经 GL colorgrade uTemperature 生效（系数 0.05）"
      ios: "同一机制：WB chip → whiteBalanceTemperatureKelvin() 写入 BeautyRenderer.Params.temperature，经 Metal lut.metal applyColorGrade uTemperature 生效（系数 0.05，2026-08-16 同步）；手动拖色温滑杆退出预设选中态；WB 模式（camera_wb_mode）与色温（camera_color_temperature）UserDefaults 持久化"
      note: "WB 模式枚举与默认值双端一致（0 自动/1 晴天/2 阴天/3 白炽灯/4 荧光灯）。2026-08-16 弃用 Camera2 CONTROL_AWB_MODE（小米 HyperOS HAL 实测忽略），统一走调色管线保证跨设备一致与 [PARITY]。iOS 侧实际编译运行的是 lut.metal，Assets/shaders/colorgrade.glsl 为同源参考副本。"

  privacy_disclosure:
    android:
      - manifest: "上述权限声明于 AndroidManifest.xml"
      - data_safety: "相机/麦克风/存储用途在 Play Data Safety 表单披露"
    ios:
      - plist: "上述 purpose strings 声明于 Info.plist"
      - xcprivacy: "相机、麦克风、照片库访问类别声明于 PrivacyInfo.xcprivacy"
    note: "用户媒体不上传远程服务器（[PRIVACY] 红线），端侧处理。"
