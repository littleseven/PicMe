        tint: white
      # 耳机连接状态角标
      headset_badge:
        visible_when: headset_or_bluetooth_connected
        position: top_end
        size: 16                     # 16dp
        background: "surface_alpha_90"
        icon:
          material: headphones       # Icons.Rounded.Headphones
          sf_symbol: "headphones"
          size: 12
        tint:
          bluetooth: "#4FC3F7"       # 浅蓝
          wired: "#81C784"           # 浅绿

    # ── AI Chat FAB ──
    - id: ai_chat_fab
      shape: circle
