name: AI Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ktlint Check
        run: ./gradlew ktlintCheck --quiet

      - name: Detekt Analysis
        run: ./gradlew detekt

      - name: JVM Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Debug Build
        run: ./gradlew assembleDebug

      - name: Upload Detekt Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: androidApp/build/reports/detekt/

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            androidApp/build/reports/tests/
            engines/beauty-engine/build/reports/tests/

  ios-build:
    name: iOS Build + Test (XcodeGen + xcodebuild)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate

      - name: Build (Simulator)
        run: |
          xcodebuild -project iosApp/PoLang.xcodeproj -scheme PoLang \
            -destination 'generic/platform=iOS Simulator' build

      - name: Test (Simulator)
        run: |
          xcodebuild -project iosApp/PoLang.xcodeproj -scheme PoLang \
            -destination 'platform=iOS Simulator,name=iPhone 16' test
