name: AI Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ktlint Check
        run: ./gradlew ktlintCheck --quiet

      - name: Detekt Analysis
        run: ./gradlew detekt

      - name: JVM Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Debug Build
        run: ./gradlew assembleDebug

      - name: Upload Detekt Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: androidApp/build/reports/detekt/

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            androidApp/build/reports/tests/
            engines/beauty-engine/build/reports/tests/

  ios-build:
    name: iOS Build (Metal shaders + Swift compile)
    runs-on: macos-latest
    timeout-minutes: 20
    # iOS job 并行于 Android job，无交叉依赖
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Metal shader compilation
        run: |
          cd iosApp/PoLang/Features/Camera/Beauty/Shaders
          for f in yuv.metal warp.metal smoothing.metal; do
            xcrun metal -std=macos-metal2.4 "$f" -o "/tmp/${f%.metal}.air"
          done
          # beauty.metal 引用 warp.metal 的 computeWarpedUv（concat 编译路径）
          cat warp.metal beauty.metal > /tmp/warp_beauty.metal
          xcrun metal -std=macos-metal2.4 /tmp/warp_beauty.metal -o /tmp/warp_beauty.air
