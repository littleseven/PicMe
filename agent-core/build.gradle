plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'com.mamba'
    compileSdk = 35

    defaultConfig {
        minSdk = 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        disable 'NewApi'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }


}

dependencies {
    // ─── 核心依赖（原 langchain4j-core + open-ai + http-client-okhttp 合并） ───

    // JSON 序列化：Gson 用于通用 JSON，Jackson 用于 OpenAI DTO 序列化/反序列化
    implementation 'com.google.code.gson:gson:2.11.0'

    // HTTP 客户端（OkHttp）
    api 'com.squareup.okhttp3:okhttp:4.10.0'
    api 'com.squareup.okhttp3:logging-interceptor:4.10.0'
    api 'com.squareup.okhttp3:okhttp-sse:4.10.0'

    // 日志（保留 SLF4J API，由调用方选择桥接实现）
    api 'org.slf4j:slf4j-api:2.0.16'

    // JSpecify（空安全注解）
    api 'org.jspecify:jspecify:1.0.0'

    // Jackson（OpenAI DTO 序列化/反序列化需要）
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.3'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.14.3'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.14.3'

    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // ─── 测试 ───
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.0'
    testImplementation 'com.google.truth:truth:1.4.4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // ─── 已删除的依赖 ───
    // ❌ opennlp-tools
    // ❌ java.net.http.HttpClient（JDK 11+）
    // ❌ ServiceLoader SPI 相关
}

// ─── Maven Publish（JitPack 需要） ───
android {
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.littleseven.langchain4android'
                artifactId = 'agent-core'
            }
        }
    }
}
